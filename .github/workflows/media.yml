# 上傳圖片／影片／音樂後自動：搬到正確資料夾 → 壓縮 → 更新 js/media.js（網頁自動放圖用的清單）
name: 自動整理圖片

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: media
  cancel-in-progress: false

jobs:
  media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝工具
        run: |
          pip install --quiet pillow pillow-heif
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: 搬移、壓縮、更新清單
        run: python3 tools/build_media.py

      - name: 有變動就存回 GitHub
        run: |
          git add -A
          if git diff --cached --quiet; then echo "沒有需要更新的檔案"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "自動整理圖片並更新 media.js"
          git pull --rebase origin master
          git push origin HEAD:master
          # 請 GitHub Pages 重新發佈一次（失敗也沒關係）
          curl -s -X POST -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true

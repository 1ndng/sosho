<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#000000">
  <title>sosho</title>
  <link rel="stylesheet" href="css/style.css?v=32">
  <link rel="stylesheet" href="css/apps.css?v=32">
</head>
<body>
  <div class="phone" id="phone">
    <!-- 狀態列 -->
    <div class="statusbar" id="statusbar">
      <span class="sb-time" id="sb-time">9:41</span>
      <span class="sb-icons">
        <svg viewBox="0 0 18 12" width="18" height="12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
        <svg viewBox="0 0 16 12" width="16" height="12"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.3A10.2 10.2 0 0 0 8 .4C5.2.4 2.7 1.5.8 3.3L2 4.6a8.5 8.5 0 0 1 6-2.4Zm0 3.6c1.3 0 2.5.5 3.4 1.3l1.2-1.3A6.7 6.7 0 0 0 8 4c-1.8 0-3.4.7-4.6 1.8l1.2 1.3c.9-.8 2.1-1.3 3.4-1.3Zm0 3.6c-.5 0-1 .2-1.3.5L8 11.6l1.3-1.7c-.3-.3-.8-.5-1.3-.5Z"/></svg>
        <span class="sb-battery"><span></span></span>
      </span>
    </div>

    <div class="screens">
      <!-- 手機首頁 -->
      <section class="home" id="home"></section>

      <!-- 匿名論壇 -->
      <section class="app forum" id="app-forum" data-app="forum">
        <div class="app-scroll" id="forum-scroll"></div>
      </section>

      <!-- Instagram -->
      <section class="app ig" id="app-ig" data-app="ig">
        <div class="app-scroll" id="ig-scroll"></div>
        <nav class="ig-tabbar" id="ig-tabbar"></nav>
        <div id="ig-overlay"></div>
      </section>

      <!-- 電話 -->
      <section class="app phone-app" id="app-phone" data-app="phone">
        <div class="app-scroll" id="phone-scroll"></div>
        <div class="app-overlay" id="phone-overlay"></div>
      </section>


      <!-- KakaoTalk -->
      <section class="app kakao-app" id="app-kakao" data-app="kakao">
        <div class="app-scroll" id="kakao-scroll"></div>
        <div class="app-overlay" id="kakao-overlay"></div>
      </section>
    </div>

    <!-- 手機密碼鎖 -->
    <div class="lock" id="lock"></div>

    <!-- 「尚未更新」提示 -->
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- iPhone 底部橫條：往上滑回首頁 -->
    <div class="home-gesture" id="home-gesture" aria-label="上滑回到首頁">
      <div class="home-indicator"></div>
    </div>
  </div>

  <!-- data.js 每次都重新下載，改完內容不會被手機快取卡住 -->
  <script>document.write('<script src="js/data.js?t=' + Date.now() + '"><\/script>');</script>
  <script src="js/apps/phone.js?v=32"></script>
  <script src="js/apps/kakao.js?v=32"></script>
  <script src="js/app.js?v=32"></script>
</body>
</html>
